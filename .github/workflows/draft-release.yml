name: Draft a Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (e.g. 1.0.0 or 1.0.0-beta.1)'
        required: true
        type: string

permissions:
  contents: write                 # 打标签 + 创建草稿 Release

jobs:
  validate:
    name: Validate version and changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check version format and changelog file
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$version' (expected X.Y.Z or X.Y.Z-suffix)"
            exit 1
          fi
          base=$(sed -n 's/^ztool\.version\.base=//p' gradle.properties | tr -d '[:space:]')
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::ztool.version.base is missing or invalid: '$base'"
            exit 1
          fi
          core="${version%%-*}"
          if [[ "$core" != "$base" ]]; then
            echo "::error::Release $version does not match ztool.version.base=$base."
            echo "Bump ztool.version.base in gradle.properties on the release commit, and bump it again after publishing."
            exit 1
          fi
          major="${version%%.*}"
          file="docs/changelog/v${major}/v${version}.md"
          if [[ ! -f "$file" ]]; then
            echo "::error::Missing release notes file: $file"
            exit 1
          fi
          echo "Release notes: $file"

  build:
    name: Build Debug & Release
    needs: validate
    # 复用 Android CI 工作流：workflow_call 下其内部逻辑等价于手动触发，总是构建
    # official-release=true 让 release APK 不带主页的非官方构建提示卡片
    # secrets: inherit —— secrets 不会自动透传给可复用工作流，签名密钥必须显式继承
    uses: ./.github/workflows/android.yml
    with:
      official-release: true
      version-name: v${{ inputs.version }}
    secrets: inherit

  draft-release:
    name: Draft release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # commit 计数必须来自完整历史

      - name: Compute release identity
        id: meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          tag="v$version"
          major="${version%%.*}"
          changelog="docs/changelog/v${major}/${tag}.md"
          code=$(git rev-list --count HEAD)
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          test -f "$changelog"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "changelog=$changelog" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (c$code), prerelease=$prerelease"

      # commit 计数是唯一的安装顺序依据；历史被改写时这里必须拦住发布。
      - name: Refuse a version code that does not advance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE: ${{ steps.meta.outputs.code }}
        run: |
          set -euo pipefail
          max_code=0
          while read -r name; do
            counter=$(printf '%s' "$name" | grep -oE '\(c[0-9]+\)' | grep -oE '[0-9]+' || true)
            if [[ -n "$counter" && "$counter" -gt "$max_code" ]]; then
              max_code=$counter
            fi
          done < <(gh release list --limit 100 --json name --jq '.[].name')
          echo "Latest published counter: $max_code; this release: $CODE"
          if [[ "$CODE" -le "$max_code" ]]; then
            echo "::error::versionCode must advance; refusing to publish $CODE after $max_code"
            exit 1
          fi

      # ---- 下载构建工作流产出的签名 Release APK 工件 ----
      - name: Download release APK artifact
        uses: actions/download-artifact@v8
        with:
          pattern: ZTool-release-signed-apk-*
          merge-multiple: true
          path: release-apk

      - name: Extract and verify release artifacts
        id: artifacts
        env:
          EXPECTED_NAME: ${{ steps.meta.outputs.tag }}
          EXPECTED_CODE: ${{ steps.meta.outputs.code }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          apk=$(find release-apk -name '*.apk' -not -name '*unsigned*' | head -n 1)
          mapping=$(find release-apk -name 'mapping.txt' | head -n 1)
          metadata=$(find release-apk -name 'output-metadata.json' | head -n 1)
          test -n "$apk" && test -n "$mapping" && test -n "$metadata"

          actual_name=$(jq -r '.elements[0].versionName' "$metadata")
          actual_code=$(jq -r '.elements[0].versionCode' "$metadata")
          if [[ "$actual_name" != "$EXPECTED_NAME" || "$actual_code" != "$EXPECTED_CODE" ]]; then
            echo "::error::Built APK is $actual_name (c$actual_code), expected $EXPECTED_NAME (c$EXPECTED_CODE)"
            exit 1
          fi

          mkdir -p release-assets
          cp "$apk" "release-assets/ZTool_v${VERSION}_c${EXPECTED_CODE}.apk"
          cp "$mapping" release-assets/mapping.txt
          echo "apk=release-assets/ZTool_v${VERSION}_c${EXPECTED_CODE}.apk" >> "$GITHUB_OUTPUT"
          echo "mapping=release-assets/mapping.txt" >> "$GITHUB_OUTPUT"

      # ---- 创建草稿 Release（标签不存在时自动在当前提交上创建） ----
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.tag }} (c${{ steps.meta.outputs.code }})
          draft: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          body_path: ${{ steps.meta.outputs.changelog }}
          files: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.mapping }}
          fail_on_unmatched_files: true
