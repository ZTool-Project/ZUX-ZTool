name: Android CI

on:
  schedule:
    - cron: '0 16 * * *'         # UTC 16:00 = 北京时间 (UTC+8) 次日 0:00
  workflow_dispatch:              # 手动触发（总是构建）
    inputs:
      # 留空时使用下方 ZTOOL_ACTIVE_BRANCH；显式填写可临时构建任意分支、标签或 SHA。
      ref:
        description: 'Branch, tag, or SHA to build (empty = ZTOOL_ACTIVE_BRANCH)'
        type: string
        default: ''
  workflow_call:                  # 供其他工作流复用（如 Draft a Release）
    inputs:
      # 仅当调用方（draft-release.yml）声明本次产出的是最终发布的 Release APK 时置 true。
      # 官方发布不计入"非官方构建"，因此其 APK 不显示主页提示卡片。
      official-release:
        description: 'Set by draft-release.yml when this run produces the official release APK'
        type: boolean
        default: false
      # 正式发布时传入完整版本名（如 v1.0.0）；留空时由 Gradle 按渠道推导。
      version-name:
        description: 'Exact versionName for an official release (e.g. v1.0.0)'
        type: string
        default: ''
  pull_request:
    # android-17 是过渡期的活跃分支，合并并删除后从列表中移除。
    branches: [ "master", "android-17" ]   # PR 触发 Debug 构建

# ---- 过渡期构建目标 ----
# android-17 是当前活跃分支，预计合并进默认分支后删除。GitHub 的 schedule 只会执行
# 默认分支（master）上的本文件，因此定时任务无法"跟随"android-17，只能在这里显式指定。
# 置空表示构建默认分支；迁移结束、删除 android-17 后移除本变量即可。
env:
  ZTOOL_ACTIVE_BRANCH: android-17

# 为 workflow run 设置友好的标题
run-name: ${{ github.event_name == 'schedule' && 'Nightly' || github.event_name == 'workflow_dispatch' && 'Manual' || 'PR' }} build #${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    # 每夜构建会发布（并清理旧的）canary Release；PR 的 fork token 仍是只读的。
    permissions:
      contents: write

    steps:
      # ---- 解析本次实际构建的分支 ----
      # PR 与 Draft a Release 必须检出各自事件自带的 ref，只有定时/手动运行才可能重定向。
      - name: Resolve build target
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_EVENT_NAME" == "workflow_call" ]]; then
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "branch=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "cache_key=$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '-')" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          target="${REQUESTED_REF:-$ZTOOL_ACTIVE_BRANCH}"
          target="${target:-$GITHUB_REF_NAME}"

          if [[ -n "$REQUESTED_REF" ]]; then
            # 手动指定的 ref 交给 checkout 解析（可以是分支、标签或 SHA）。
            sha="$REQUESTED_REF"
          elif sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/$target" --jq .commit.sha 2>/dev/null); then
            # 固定在分支当前提交上，避免解析与检出之间分支移动。
            :
          elif [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch 2>/dev/null || true)" == "$GITHUB_REF_NAME" ]]; then
            # 活跃分支被删除后自动回落到默认分支，避免过渡期结束后每夜构建永久失败。
            echo "::warning::Branch '$target' does not exist; building '$GITHUB_REF_NAME' instead. Remove ZTOOL_ACTIVE_BRANCH from android.yml once the migration is done."
            target="$GITHUB_REF_NAME"
            sha="$GITHUB_SHA"
          else
            # API 不可达时宁可失败，也不要静默构建一个并非目标的旧分支。
            echo "::error::Cannot resolve branch '$target' and the repository API is unreachable; refusing to build an unintended branch."
            exit 1
          fi

          echo "ref=$sha" >> "$GITHUB_OUTPUT"
          echo "branch=$target" >> "$GITHUB_OUTPUT"
          echo "cache_key=$(printf '%s' "$target" | tr '/' '-')" >> "$GITHUB_OUTPUT"
          echo "Building $target at $sha"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0   # 需要完整历史以获取提交信息

      # ---- 获取当前 commit 信息 ----
      - name: Get current commit info
        id: commit-info
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "subject=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

      # ---- 对于 schedule 和 workflow_dispatch 事件，尝试恢复上次构建的 SHA ----
      - name: Restore previous build commit SHA
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: .last-build-sha
          # 按目标分支隔离；第二级前缀负责接续旧 key 和跨分支的一次性对比。
          key: nightly-commit-sha-${{ steps.target.outputs.cache_key }}-${{ github.run_id }}
          restore-keys: |
            nightly-commit-sha-${{ steps.target.outputs.cache_key }}-
            nightly-commit-sha-

      # ---- 获取从上次构建以来的全部提交记录 ----
      - name: Get commit range for summary
        id: commit-range
        run: |
          last_sha=""
          if [[ -f .last-build-sha ]]; then
            candidate=$(cat .last-build-sha)
            # 缓存可能来自已删除的分支或已被清理的提交；不可解析时退回单条摘要。
            if git cat-file -e "${candidate}^{commit}" 2>/dev/null; then
              last_sha="$candidate"
            fi
          fi
          if [[ -n "$last_sha" ]]; then
            echo "commits<<EOF" >> $GITHUB_OUTPUT
            git log ${last_sha}..HEAD --pretty=format:"- **\`%h\`** %s (%an)" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "commits=- **\`$(git rev-parse --short HEAD)\`** $(git log -1 --pretty=%s) ($(git log -1 --pretty=%an))" >> $GITHUB_OUTPUT
          fi

      # ---- 决定是否要构建 ----
      - name: Determine if build is needed
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Event ${{ github.event_name }} → building."
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ -f .last-build-sha ]]; then
              last_sha=$(cat .last-build-sha)
              current_sha="${{ steps.commit-info.outputs.sha }}"
              if [[ "$last_sha" == "$current_sha" ]]; then
                echo "should_build=false" >> $GITHUB_OUTPUT
                echo "No new commits since last nightly, skipping build."
              else
                echo "should_build=true" >> $GITHUB_OUTPUT
                echo "New commits detected, building."
              fi
            else
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "No previous build SHA found, building."
            fi
          else
            # workflow_call 由 draft-release.yml 触发，必须构建
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Event ${{ github.event_name }} → building."
          fi

      # ---- 只在需要构建时才 setup JDK 和准备 gradlew ----
      - name: Set up JDK 17
        if: steps.check.outputs.should_build == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        if: steps.check.outputs.should_build == 'true'
        run: chmod +x gradlew

      # ---- 只有在需要时才执行构建 ----
      # Debug 构建（PR 总是构建，其他事件则根据 should_build）
      - name: Build debug APK
        if: github.event_name == 'pull_request' || (github.event_name != 'pull_request' && steps.check.outputs.should_build == 'true')
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: github.event_name == 'pull_request' || (github.event_name != 'pull_request' && steps.check.outputs.should_build == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: ZTool-debug-apk-${{ steps.commit-info.outputs.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error

      # ---- Release 构建（schedule / workflow_dispatch / 发布工作流调用） ----
      - name: Prepare release keystore
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs['official-release'] == true) && steps.check.outputs.should_build == 'true'
        env:
          ZTOOL_RELEASE_KEYSTORE_BASE64: ${{ secrets.ZTOOL_RELEASE_KEYSTORE_BASE64 }}
          ZTOOL_RELEASE_STORE_PASSWORD: ${{ secrets.ZTOOL_RELEASE_STORE_PASSWORD }}
          ZTOOL_RELEASE_KEY_ALIAS: ${{ secrets.ZTOOL_RELEASE_KEY_ALIAS }}
          ZTOOL_RELEASE_KEY_PASSWORD: ${{ secrets.ZTOOL_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$ZTOOL_RELEASE_KEYSTORE_BASE64"
          test -n "$ZTOOL_RELEASE_STORE_PASSWORD"
          test -n "$ZTOOL_RELEASE_KEY_ALIAS"
          test -n "$ZTOOL_RELEASE_KEY_PASSWORD"
          printf '%s' "$ZTOOL_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ztool-release.jks"
          chmod 600 "$RUNNER_TEMP/ztool-release.jks"

      - name: Build signed release APK
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs['official-release'] == true) && steps.check.outputs.should_build == 'true'
        env:
          # 直接触发（schedule / workflow_dispatch）时 inputs 为空 → '0' → 非官方构建；
          # 只有 draft-release.yml 传入 official-release=true 才标记为官方发布。
          ZTOOL_OFFICIAL_RELEASE: ${{ inputs['official-release'] && '1' || '0' }}
          ZTOOL_BUILD_CHANNEL: ${{ github.event_name == 'schedule' && 'canary' || '' }}
          ZTOOL_VERSION_NAME: ${{ inputs['version-name'] }}
          ZTOOL_RELEASE_STORE_FILE: ${{ runner.temp }}/ztool-release.jks
          ZTOOL_RELEASE_STORE_PASSWORD: ${{ secrets.ZTOOL_RELEASE_STORE_PASSWORD }}
          ZTOOL_RELEASE_KEY_ALIAS: ${{ secrets.ZTOOL_RELEASE_KEY_ALIAS }}
          ZTOOL_RELEASE_KEY_PASSWORD: ${{ secrets.ZTOOL_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$ZTOOL_VERSION_NAME" ]]; then
            ./gradlew assembleRelease -Pztool.versionName="$ZTOOL_VERSION_NAME"
          else
            ./gradlew assembleRelease
          fi

      # R8 混淆映射随 APK 一起上传：没有它，用户上报的 release 崩溃栈无法 retrace
      # （r8-map-id-<hash> 只能靠对应构建的 mapping.txt 还原）。
      - name: Upload signed release APK and R8 mapping
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs['official-release'] == true) && steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ZTool-release-signed-apk-${{ steps.commit-info.outputs.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/output-metadata.json
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      # ---- 每夜 canary Release：始终只保留最新一个 ----
      - name: Read built canary version
        id: canary-version
        if: github.event_name == 'schedule' && steps.check.outputs.should_build == 'true'
        run: |
          metadata=$(find app/build/outputs/apk/release -name output-metadata.json | head -n 1)
          test -n "$metadata"
          name=$(jq -r '.elements[0].versionName' "$metadata")
          code=$(jq -r '.elements[0].versionCode' "$metadata")
          test -n "$name" && test -n "$code" && test "$code" != "null"
          # 旧版 build.gradle 不识别 ZTOOL_BUILD_CHANNEL。若回落到尚未合并的分支，
          # 必须先拦住，避免用 Beta/… 覆盖并清理掉有效的 canary Release。
          if [[ "$name" != *-canary.* ]]; then
            echo "::error::Scheduled build produced '$name' instead of a canary version; refusing to publish. Check that ZTOOL_ACTIVE_BRANCH points at a branch with the canary versioning."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # 切换构建分支或改写历史都可能让新的 versionCode 不再递增。低于线上 canary 时
      # 必须拒绝发布：否则停在更高 code 的用户收不到更新，旧包又已被清理。
      - name: Refuse a canary versionCode that does not advance
        if: github.event_name == 'schedule' && steps.check.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE: ${{ steps.canary-version.outputs.code }}
        run: |
          set -euo pipefail
          names=$(gh release list --limit 100 --json tagName,name --jq '.[] | select(.tagName | test("-canary\\.")) | .name')
          max_code=0
          while IFS= read -r name; do
            [[ -n "$name" ]] || continue
            counter=$(printf '%s' "$name" | grep -oE '\(c[0-9]+\)' | grep -oE '[0-9]+' || true)
            if [[ -n "$counter" && "$counter" -gt "$max_code" ]]; then
              max_code=$counter
            fi
          done <<< "$names"
          echo "Latest published canary versionCode: $max_code; this build: $CODE"
          if (( CODE < max_code )); then
            echo "::error::Canary versionCode $CODE does not advance past the published $max_code; refusing to replace it."
            exit 1
          fi

      - name: Prepare canary assets
        if: github.event_name == 'schedule' && steps.check.outputs.should_build == 'true'
        env:
          VERSION_NAME: ${{ steps.canary-version.outputs.name }}
          VERSION_CODE: ${{ steps.canary-version.outputs.code }}
          COMMITS: ${{ steps.commit-range.outputs.commits }}
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' -not -name '*unsigned*' | head -n 1)
          test -n "$apk"
          mkdir -p canary-assets
          cp "$apk" "canary-assets/ZTool_${VERSION_NAME}_c${VERSION_CODE}.apk"
          cp app/build/outputs/mapping/release/mapping.txt canary-assets/
          {
            echo "Nightly canary build \`$VERSION_NAME\` (c$VERSION_CODE) from \`${{ steps.commit-info.outputs.sha }}\`."
            echo
            echo "### Changes"
            printf '%s\n' "$COMMITS"
          } > canary-notes.md
          cat canary-notes.md

      - name: Publish canary release
        if: github.event_name == 'schedule' && steps.check.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.canary-version.outputs.name }}
          VERSION_CODE: ${{ steps.canary-version.outputs.code }}
        run: |
          set -euo pipefail
          tag="$VERSION_NAME"
          # Same-day rebuild replaces the existing release instead of failing.
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          # 目标必须是实际构建的提交：定时任务运行在默认分支，github.sha 指向 master 而非 android-17。
          gh release create "$tag" \
            --target "${{ steps.commit-info.outputs.sha }}" \
            --title "$VERSION_NAME (c$VERSION_CODE)" \
            --notes-file canary-notes.md \
            --prerelease \
            canary-assets/*
          # Create first, delete after: the feed never loses its canary entry.
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | { grep -E -- '-canary\.' || true; } \
            | while read -r old; do
                if [[ "$old" != "$tag" ]]; then
                  gh release delete "$old" --yes --cleanup-tag || true
                fi
              done

      # ---- 保存本次 commit SHA 供下次 nightly 使用（仅当构建成功） ----
      # 只记录真正发布过 canary 的定时构建：手动运行不发布，若也写入，当晚的 nightly
      # 会认为该提交“已构建”而跳过，这个提交当晚就没有预览包。
      - name: Save current commit SHA for future nightly
        if: github.event_name == 'schedule' && steps.check.outputs.should_build == 'true'
        run: |
          echo "${{ steps.commit-info.outputs.sha }}" > .last-build-sha

      - name: Save cache
        if: github.event_name == 'schedule' && steps.check.outputs.should_build == 'true'
        uses: actions/cache/save@v6
        with:
          path: .last-build-sha
          key: nightly-commit-sha-${{ steps.target.outputs.cache_key }}-${{ github.run_id }}

      # ---- 生成 Job Summary，展示提交信息 ----
      - name: Generate job summary
        if: always()
        env:
          # 多行值必须经 env 传递：run 内联的 ${{ }} 会移除换行，
          # 且反引号在 bash 双引号内会触发命令替换，破坏 markdown
          COMMITS: ${{ steps.commit-range.outputs.commits }}
        run: |
          echo "## Build Details" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target branch:** \`${{ steps.target.outputs.branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo '**Commit SHA:** `${{ steps.commit-info.outputs.sha }}`' >> $GITHUB_STEP_SUMMARY
          echo "### Commits" >> $GITHUB_STEP_SUMMARY
          echo "$COMMITS" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.check.outputs.should_build }}" == "true" ]]; then
            echo "**Status:** ✅ Built" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ⏭️ Skipped (no new commits)" >> $GITHUB_STEP_SUMMARY
          fi
