name: Android CI

on:
  schedule:
    - cron: '0 16 * * *'         # UTC 16:00 = 北京时间 (UTC+8) 次日 0:00
  workflow_dispatch:              # 手动触发（总是构建）
  workflow_call:                  # 供其他工作流复用（如 Draft a Release）
    inputs:
      # 仅当调用方（draft-release.yml）声明本次产出的是最终发布的 Release APK 时置 true。
      # 官方发布不计入"非官方构建"，因此其 APK 不显示主页提示卡片。
      official-release:
        description: 'Set by draft-release.yml when this run produces the official release APK'
        type: boolean
        default: false
      # 正式发布时传入完整版本名（如 v1.0.0）；留空时由 Gradle 按渠道推导。
      version-name:
        description: 'Exact versionName for an official release (e.g. v1.0.0)'
        type: string
        default: ''
  pull_request:
    branches: [ "master" ]        # PR 触发 Debug 构建

# 为 workflow run 设置友好的标题
run-name: ${{ github.event_name == 'schedule' && 'Nightly' || github.event_name == 'workflow_dispatch' && 'Manual' || 'PR' }} build #${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    # 每夜构建会发布（并清理旧的）canary Release；PR 的 fork token 仍是只读的。
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 需要完整历史以获取提交信息

      # ---- 获取当前 commit 信息 ----
      - name: Get current commit info
        id: commit-info
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "subject=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

      # ---- 对于 schedule 和 workflow_dispatch 事件，尝试恢复上次构建的 SHA ----
      - name: Restore previous build commit SHA
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: .last-build-sha
          key: nightly-commit-sha-master-${{ github.run_id }}
          restore-keys: nightly-commit-sha-master-

      # ---- 获取从上次构建以来的全部提交记录 ----
      - name: Get commit range for summary
        id: commit-range
        run: |
          if [[ -f .last-build-sha ]]; then
            last_sha=$(cat .last-build-sha)
            echo "commits<<EOF" >> $GITHUB_OUTPUT
            git log ${last_sha}..HEAD --pretty=format:"- **\`%h\`** %s (%an)" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "commits=- **\`$(git rev-parse --short HEAD)\`** $(git log -1 --pretty=%s) ($(git log -1 --pretty=%an))" >> $GITHUB_OUTPUT
          fi

      # ---- 决定是否要构建 ----
      - name: Determine if build is needed
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Event ${{ github.event_name }} → building."
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ -f .last-build-sha ]]; then
              last_sha=$(cat .last-build-sha)
              current_sha="${{ steps.commit-info.outputs.sha }}"
              if [[ "$last_sha" == "$current_sha" ]]; then
                echo "should_build=false" >> $GITHUB_OUTPUT
                echo "No new commits since last nightly, skipping build."
              else
                echo "should_build=true" >> $GITHUB_OUTPUT
                echo "New commits detected, building."
              fi
            else
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "No previous build SHA found, building."
            fi
          else
            # workflow_call 由 draft-release.yml 触发，必须构建
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Event ${{ github.event_name }} → building."
          fi

      # ---- 只在需要构建时才 setup JDK 和准备 gradlew ----
      - name: Set up JDK 17
        if: steps.check.outputs.should_build == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        if: steps.check.outputs.should_build == 'true'
        run: chmod +x gradlew

      # ---- 只有在需要时才执行构建 ----
      # Debug 构建（PR 总是构建，其他事件则根据 should_build）
      - name: Build debug APK
        if: github.event_name == 'pull_request' || (github.event_name != 'pull_request' && steps.check.outputs.should_build == 'true')
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: github.event_name == 'pull_request' || (github.event_name != 'pull_request' && steps.check.outputs.should_build == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: ZTool-debug-apk-${{ steps.commit-info.outputs.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error

      # ---- Release 构建（schedule / workflow_dispatch / 发布工作流调用） ----
      - name: Prepare release keystore
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs['official-release'] == true) && steps.check.outputs.should_build == 'true'
        env:
          ZTOOL_RELEASE_KEYSTORE_BASE64: ${{ secrets.ZTOOL_RELEASE_KEYSTORE_BASE64 }}
          ZTOOL_RELEASE_STORE_PASSWORD: ${{ secrets.ZTOOL_RELEASE_STORE_PASSWORD }}
          ZTOOL_RELEASE_KEY_ALIAS: ${{ secrets.ZTOOL_RELEASE_KEY_ALIAS }}
          ZTOOL_RELEASE_KEY_PASSWORD: ${{ secrets.ZTOOL_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$ZTOOL_RELEASE_KEYSTORE_BASE64"
          test -n "$ZTOOL_RELEASE_STORE_PASSWORD"
          test -n "$ZTOOL_RELEASE_KEY_ALIAS"
          test -n "$ZTOOL_RELEASE_KEY_PASSWORD"
          printf '%s' "$ZTOOL_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ztool-release.jks"
          chmod 600 "$RUNNER_TEMP/ztool-release.jks"

      - name: Build signed release APK
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs['official-release'] == true) && steps.check.outputs.should_build == 'true'
        env:
          # 直接触发（schedule / workflow_dispatch）时 inputs 为空 → '0' → 非官方构建；
          # 只有 draft-release.yml 传入 official-release=true 才标记为官方发布。
          ZTOOL_OFFICIAL_RELEASE: ${{ inputs['official-release'] && '1' || '0' }}
          ZTOOL_BUILD_CHANNEL: ${{ github.event_name == 'schedule' && 'canary' || '' }}
          ZTOOL_VERSION_NAME: ${{ inputs['version-name'] }}
          ZTOOL_RELEASE_STORE_FILE: ${{ runner.temp }}/ztool-release.jks
          ZTOOL_RELEASE_STORE_PASSWORD: ${{ secrets.ZTOOL_RELEASE_STORE_PASSWORD }}
          ZTOOL_RELEASE_KEY_ALIAS: ${{ secrets.ZTOOL_RELEASE_KEY_ALIAS }}
          ZTOOL_RELEASE_KEY_PASSWORD: ${{ secrets.ZTOOL_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$ZTOOL_VERSION_NAME" ]]; then
            ./gradlew assembleRelease -Pztool.versionName="$ZTOOL_VERSION_NAME"
          else
            ./gradlew assembleRelease
          fi

      # R8 混淆映射随 APK 一起上传：没有它，用户上报的 release 崩溃栈无法 retrace
      # （r8-map-id-<hash> 只能靠对应构建的 mapping.txt 还原）。
      - name: Upload signed release APK and R8 mapping
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs['official-release'] == true) && steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ZTool-release-signed-apk-${{ steps.commit-info.outputs.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/output-metadata.json
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      # ---- 每夜 canary Release：始终只保留最新一个 ----
      - name: Read built canary version
        id: canary-version
        if: github.event_name == 'schedule' && steps.check.outputs.should_build == 'true'
        run: |
          metadata=$(find app/build/outputs/apk/release -name output-metadata.json | head -n 1)
          test -n "$metadata"
          name=$(jq -r '.elements[0].versionName' "$metadata")
          code=$(jq -r '.elements[0].versionCode' "$metadata")
          test -n "$name" && test -n "$code" && test "$code" != "null"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Prepare canary assets
        if: github.event_name == 'schedule' && steps.check.outputs.should_build == 'true'
        env:
          VERSION_NAME: ${{ steps.canary-version.outputs.name }}
          VERSION_CODE: ${{ steps.canary-version.outputs.code }}
          COMMITS: ${{ steps.commit-range.outputs.commits }}
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' -not -name '*unsigned*' | head -n 1)
          test -n "$apk"
          mkdir -p canary-assets
          cp "$apk" "canary-assets/ZTool_${VERSION_NAME}_c${VERSION_CODE}.apk"
          cp app/build/outputs/mapping/release/mapping.txt canary-assets/
          {
            echo "Nightly canary build \`$VERSION_NAME\` (c$VERSION_CODE) from \`${{ steps.commit-info.outputs.sha }}\`."
            echo
            echo "### Changes"
            printf '%s\n' "$COMMITS"
          } > canary-notes.md
          cat canary-notes.md

      - name: Publish canary release
        if: github.event_name == 'schedule' && steps.check.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.canary-version.outputs.name }}
          VERSION_CODE: ${{ steps.canary-version.outputs.code }}
        run: |
          set -euo pipefail
          tag="$VERSION_NAME"
          # Same-day rebuild replaces the existing release instead of failing.
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" \
            --target "${{ github.sha }}" \
            --title "$VERSION_NAME (c$VERSION_CODE)" \
            --notes-file canary-notes.md \
            --prerelease \
            canary-assets/*
          # Create first, delete after: the feed never loses its canary entry.
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | { grep -E -- '-canary\.' || true; } \
            | while read -r old; do
                if [[ "$old" != "$tag" ]]; then
                  gh release delete "$old" --yes --cleanup-tag || true
                fi
              done

      # ---- 保存本次 commit SHA 供下次 nightly 使用（仅当构建成功） ----
      - name: Save current commit SHA for future nightly
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.check.outputs.should_build == 'true'
        run: |
          echo "${{ steps.commit-info.outputs.sha }}" > .last-build-sha

      - name: Save cache
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.check.outputs.should_build == 'true'
        uses: actions/cache/save@v6
        with:
          path: .last-build-sha
          key: nightly-commit-sha-master-${{ github.run_id }}

      # ---- 生成 Job Summary，展示提交信息 ----
      - name: Generate job summary
        if: always()
        env:
          # 多行值必须经 env 传递：run 内联的 ${{ }} 会移除换行，
          # 且反引号在 bash 双引号内会触发命令替换，破坏 markdown
          COMMITS: ${{ steps.commit-range.outputs.commits }}
        run: |
          echo "## Build Details" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo '**Commit SHA:** `${{ steps.commit-info.outputs.sha }}`' >> $GITHUB_STEP_SUMMARY
          echo "### Commits" >> $GITHUB_STEP_SUMMARY
          echo "$COMMITS" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.check.outputs.should_build }}" == "true" ]]; then
            echo "**Status:** ✅ Built" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ⏭️ Skipped (no new commits)" >> $GITHUB_STEP_SUMMARY
          fi
